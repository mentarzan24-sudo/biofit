<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioFit Science | Проект Соболева Владимира</title>
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --neon-blue: #a855f7;
            --neon-green: #10b981;
            --neon-purple: #d946ef;
            --neon-red: #ef4444;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-top: 70px;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 15px 0;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1, h2, h3 {
            color: var(--neon-blue);
            margin-bottom: 20px;
        }

        h2 {
            border-bottom: 2px solid var(--neon-blue);
            display: inline-block;
            padding-bottom: 5px;
        }

        p {
            margin-bottom: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.05);
        }

        .btn {
            background: linear-gradient(135deg, #7e22ce, var(--neon-blue));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
            width: 100%;
            margin-top: 15px;
        }
